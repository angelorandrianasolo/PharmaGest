{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <h1 class="h4">Choisir un nouveau mot de passe</h1>
  {% if validlink %}
  <form method="post" class="card card-body shadow-sm">
    {% csrf_token %}
    {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
    <button class="btn btn-primary" type="submit">Valider</button>
  </form>
  {% else %}<div class="alert alert-danger">Lien invalide ou expiré.</div>{% endif %}
</div></div>
{% endblock %}
