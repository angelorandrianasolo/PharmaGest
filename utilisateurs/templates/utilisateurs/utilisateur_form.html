{% extends 'base.html' %}
{% block content %}
<h1 class="h4 mb-3">{% if form.instance.pk %}Modifier l'utilisateur{% else %}Nouvel utilisateur{% endif %}</h1>
<form method="post" class="card card-body shadow-sm">
  {% csrf_token %}
  {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
  {{ form.non_field_errors }}
  <button class="btn btn-primary" type="submit">Enregistrer</button>
  <a class="btn btn-secondary" href="{% url 'utilisateurs:liste' %}">Annuler</a>
</form>
{% endblock %}
