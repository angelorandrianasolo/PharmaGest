{% extends 'base.html' %}
{% block title %}Connexion — PharmaGest{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white"><h1 class="h5 mb-0">Connexion</h1></div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              {{ field.errors }}
            </div>
          {% endfor %}
          {{ form.non_field_errors }}
          <button class="btn btn-primary w-100" type="submit">Se connecter</button>
        </form>
        <p class="mt-3 mb-0"><a href="{% url 'utilisateurs:password_reset' %}">Mot de passe oublié ?</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
