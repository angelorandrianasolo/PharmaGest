name: pharmagest

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmagest}
      POSTGRES_USER: ${POSTGRES_USER:-pharmagest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmagest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharmagest} -d ${POSTGRES_DB:-pharmagest}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pharmagest}:${POSTGRES_PASSWORD:-pharmagest}@db:5432/${POSTGRES_DB:-pharmagest}
    volumes:
      - .:/app:z
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
  media_data:
