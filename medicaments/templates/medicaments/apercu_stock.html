<div class="card h-100">
  <div class="card-header"><svg class="ico"><use href="#i-alert"/></svg> Alertes de stock</div>
  <ul class="list-alertes">
    {% for m in alertes %}
      <li>
        <a href="{% url 'medicaments:detail' m.pk %}">{{ m.nom }}</a>
        <span class="badge bg-warning">{{ m.stock_valide|default:0 }} / {{ m.seuil_alerte }}</span>
      </li>
    {% empty %}<li class="vide">Aucune alerte.</li>{% endfor %}
  </ul>
</div>
